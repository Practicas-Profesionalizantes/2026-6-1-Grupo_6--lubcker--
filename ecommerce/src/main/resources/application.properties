# Cargar configuracion local (contrasenas, claves). Ese archivo NO se sube a GitHub.
spring.config.import=optional:file:./local.properties,optional:file:./secrets.properties

# Base de datos MySQL. En produccion se configura con variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:Lubcker}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA. En produccion usar DDL_AUTO=validate (o none) para que no modifique las tablas.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# JSON: si falta un campo numerico (ej. idCliente) se toma como 0 en vez de rechazar el pedido.
# Spring Boot 4 (Jackson 3) lo rechaza por defecto; las validaciones (@Positive, etc.) siguen aplicando.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Subida de imagenes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Seguridad
# Clave para firmar los tokens (minimo 32 caracteres). Sin ella se genera una al azar en cada arranque.
app.jwt.secret=${JWT_SECRET:}
app.jwt.horas-validez=${JWT_HORAS:8}
# Origenes del frontend permitidos (separados por coma)
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:3000}

# Asistente de chat (Lubcki) - API de Gemini (Google)
# La clave NO va aca ni en local.properties (que se sube a GitHub): va en secrets.properties
# (ver secrets.properties.example) o en la variable de entorno GEMINI_API_KEY.
app.chat.api-key=${GEMINI_API_KEY:}
app.chat.modelo=${CHAT_MODELO:gemini-3.5-flash}
app.chat.base-url=${CHAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.chat.limite-por-hora=${CHAT_LIMITE_HORA:30}
app.chat.limite-por-dia=${CHAT_LIMITE_DIA:2000}
app.chat.max-tokens-salida=1024
# Tokens que el modelo puede gastar "pensando" antes de responder (0 = no piensa, responde mas rapido y barato).
# Poner un numero negativo para no enviar el parametro si el modelo elegido no lo acepta.
app.chat.pensamiento-tokens=${CHAT_PENSAMIENTO_TOKENS:0}

# Mercado Pago (Checkout Pro)
# El access token NO va aca ni en local.properties: va en secrets.properties (ver secrets.properties.example)
# o en la variable de entorno MERCADOPAGO_ACCESS_TOKEN.
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
# A donde vuelve el cliente despues de pagar (URL del frontend)
app.mercadopago.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
# URL publica del backend para los avisos de pago, ej: https://mi-backend.com/api/mercadopago/webhook
# En localhost queda vacia: el pago se verifica cuando el cliente vuelve a la tienda.
app.mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}
# Secreto de firma del webhook (Tus integraciones > Webhooks). Opcional.
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# Horas que tiene el cliente para pagar; despues el pedido se cancela y el stock vuelve
app.mercadopago.horas-para-pagar=${MERCADOPAGO_HORAS_PARA_PAGAR:24}

# Documentacion de la API (Swagger UI en /swagger-ui.html, OpenAPI en /v3/api-docs).
# En produccion conviene apagarla con SWAGGER_HABILITADO=false.
springdoc.api-docs.enabled=${SWAGGER_HABILITADO:true}
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:true}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.doc-expansion=none
